<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ТОП ДОНАТЕРОВ — Donatty</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --void:#06120c; --glass-top:rgba(10,32,21,.96); --glass-bottom:rgba(4,15,10,.94);
    --hairline:rgba(255,255,255,.08); --hairline-2:rgba(255,255,255,.16);
    --violet-rgb:34,197,94; --violet-soft:#b6ffd3; --ink:#f0fff6; --ink-dim:#7fb096;
    --rank1:#6dffb2; --rank1-rgb:109,255,178;
    --rank2:#9ad9b4; --rank2-rgb:154,217,180;
    --rank3:#3fcf8e; --rank3-rgb:63,207,142;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;font-family:'Manrope',sans-serif;overflow:hidden}
  #wrap{width:452px;padding:22px 24px 24px;position:relative;isolation:isolate}
  #title{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px}
  #title svg{flex-shrink:0;filter:drop-shadow(0 0 6px rgba(var(--rank1-rgb),.55))}
  .titletext{background:linear-gradient(100deg,#fff 10%,#9dffc8 120%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 2px rgba(0,0,0,.95)) drop-shadow(0 0 8px rgba(0,0,0,.7))}
  #statuschip{margin:11px 0 18px;display:inline-flex;align-items:center;gap:7px;background:rgba(3,16,10,.88);border:1px solid var(--hairline-2);border-radius:100px;padding:5px 13px 5px 10px;backdrop-filter:blur(6px)}
  #dot{width:7px;height:7px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 6px #ff4d4d;transition:all .3s;flex-shrink:0}
  #dot.live{background:#4dffa0;box-shadow:0 0 6px #4dffa0,0 0 14px #4dffa0;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  #status{font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.9)}

  #list{display:flex;flex-direction:column;gap:11px}
  .row{position:relative;display:flex;align-items:center;gap:11px;background:linear-gradient(155deg,var(--glass-top),var(--glass-bottom));border:1px solid var(--hairline);border-radius:15px;padding:11px 17px 11px 14px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:transform .35s cubic-bezier(.22,1,.36,1)}
  .row:hover{transform:translateX(3px)}
  .row.rank1{border-color:rgba(var(--rank1-rgb),.6);padding:14px 17px 14px 14px;animation:glow 2.6s ease-in-out infinite}
  .row.rank2{border-color:rgba(var(--rank2-rgb),.32)}
  .row.rank3{border-color:rgba(var(--rank3-rgb),.34)}
  @keyframes glow{
    0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 34px -4px rgba(var(--rank1-rgb),.7),0 0 70px -12px rgba(var(--rank1-rgb),.5)}
    50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 46px -2px rgba(var(--rank1-rgb),.95),0 0 95px -6px rgba(var(--rank1-rgb),.7)}
  }
  .row:not(:first-child)::before{content:"";position:absolute;top:-11px;height:11px;left:31px;width:2px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.06));z-index:2}
  .row.rank1::after{content:"";position:absolute;top:0;left:-70%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(var(--rank1-rgb),.12),transparent);animation:sweep 4.5s ease-in-out infinite;pointer-events:none}
  @keyframes sweep{0%{left:-70%}60%,100%{left:130%}}
  .bar{position:absolute;inset:0;width:0;background:linear-gradient(90deg,rgba(var(--violet-rgb),.16),transparent);z-index:1;transition:width .6s cubic-bezier(.22,1,.36,1);pointer-events:none}
  .rank1 .bar{background:linear-gradient(90deg,rgba(var(--rank1-rgb),.22),transparent)}
  .rank2 .bar{background:linear-gradient(90deg,rgba(var(--rank2-rgb),.16),transparent)}
  .rank3 .bar{background:linear-gradient(90deg,rgba(var(--rank3-rgb),.18),transparent)}

  .node{position:relative;z-index:2;width:34px;height:34px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--ink);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1.5px solid var(--hairline-2)}
  .rank1 .node{border:2px solid var(--rank1);color:var(--rank1);box-shadow:0 0 4px rgba(var(--rank1-rgb),.9),0 0 18px rgba(var(--rank1-rgb),.6)}
  .rank2 .node{border-color:var(--rank2);color:var(--rank2)}
  .rank3 .node{border-color:var(--rank3);color:var(--rank3)}

  .avatar-wrap{position:relative;width:42px;height:42px;flex-shrink:0;z-index:2}
  .rank1 .avatar-wrap{width:48px;height:48px}
  .rank1 .avatar-wrap::before,.rank1 .avatar-wrap::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(var(--rank1-rgb),.8);box-shadow:0 0 14px rgba(var(--rank1-rgb),.6),inset 0 0 10px rgba(var(--rank1-rgb),.35);opacity:0;animation:ripple 2.8s ease-out infinite;z-index:0}
  .rank1 .avatar-wrap::after{animation-delay:1.4s}
  @keyframes ripple{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.75);opacity:0}}
  .coins{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
  .coins i{position:absolute;bottom:-14px;font-style:normal;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--rank1);text-shadow:0 0 8px rgba(var(--rank1-rgb),.9);opacity:0;animation:floatUp 3.6s ease-in infinite}
  @keyframes floatUp{0%{transform:translateY(0) rotate(-12deg) scale(.7);opacity:0}18%{opacity:.85}70%{opacity:.55}100%{transform:translateY(-84px) rotate(14deg) scale(1.1);opacity:0}}
  .avatar{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;color:#fff;border:2px solid var(--void);box-shadow:0 0 0 3px rgba(255,255,255,.1)}
  .rank1 .avatar{font-size:21px}
  .rank2 .avatar{box-shadow:0 0 0 3px rgba(var(--rank2-rgb),.5)}
  .rank3 .avatar{box-shadow:0 0 0 3px rgba(var(--rank3-rgb),.5)}
  .crown{position:absolute;top:-15px;left:50%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 0 6px rgba(var(--rank1-rgb),1))}

  .textbox{flex:1;z-index:2;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .info{min-width:0;flex:1}
  .name{font-weight:800;font-size:15.5px;letter-spacing:-.1px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.9)}
  .rank1 .name{font-size:16.5px;text-shadow:0 0 10px rgba(var(--rank1-rgb),.65),0 1px 4px rgba(0,0,0,.9)}
  .msglabel{font-size:10.5px;font-weight:600;color:var(--ink-dim);letter-spacing:.2px;margin-top:2px}
  .count{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--violet-soft);text-shadow:0 0 8px rgba(34,197,94,.5);text-align:right;flex-shrink:0;white-space:nowrap}
  .rank1 .count{color:var(--rank1);font-size:20px;text-shadow:0 0 12px rgba(var(--rank1-rgb),.85),0 0 26px rgba(var(--rank1-rgb),.5)}
  .rank2 .count{color:var(--rank2)}
  .rank3 .count{color:var(--rank3)}
  .empty{color:var(--ink-dim);font-size:13px;font-weight:600;padding:12px 4px 4px}

  #footer{display:flex;margin-top:15px;background:rgba(3,13,8,.92);border:1px solid var(--hairline-2);border-radius:12px;overflow:hidden;backdrop-filter:blur(6px)}
  .stat{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 11px;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;color:var(--ink)}
  .stat + .stat::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--hairline-2)}
  .stat b{color:var(--rank1);font-weight:800}
  .statlabel{font-family:'Manrope',sans-serif;font-weight:700;color:var(--ink-dim)}
  #setup{display:flex;flex-direction:column;gap:10px;background:linear-gradient(155deg,var(--glass-top),var(--glass-bottom));border:1px solid var(--hairline-2);border-radius:15px;padding:14px 16px}
  #setup label{font-size:12px;font-weight:700;color:var(--ink-dim)}
  #setup input{font:600 12px 'JetBrains Mono',monospace;color:var(--ink);background:rgba(3,16,10,.7);border:1px solid var(--hairline-2);border-radius:10px;padding:9px 11px;outline:none}
  #setup input:focus{border-color:var(--violet-soft)}
  #setup button{font:800 13px 'Manrope',sans-serif;color:#fff;background:linear-gradient(100deg,#22c55e,#0fa968);border:0;border-radius:10px;padding:9px;cursor:pointer}
  #setup .err{font-size:11px;font-weight:700;color:#ff8a8a;min-height:14px}
  @media (prefers-reduced-motion:reduce){#dot.live,.row.rank1,.row.rank1::after{animation:none!important}.rank1 .avatar-wrap::before,.rank1 .avatar-wrap::after,.coins i{animation:none!important;opacity:0}}
</style>
</head>
<body>

<div id="wrap">
  <div id="title">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 2.2c1 2.6 2.6 4.4 4.9 6.3 2.1 1.7 3.1 3.6 3.1 5.7 0 4.3-3.6 7.8-8 7.8s-8-3.5-8-7.8c0-2.5 1.3-4.5 2.9-6 .1 1.5.9 2.5 1.7 3-.3-2.9.8-5.8 3.4-9z" fill="url(#sg)"/><defs><linearGradient id="sg" x1="4.5" y1="2.2" x2="19.5" y2="22"><stop stop-color="#eafff2"/><stop offset="1" stop-color="#1fbf75"/></linearGradient></defs></svg>
    <span class="titletext">Топ донатеров</span>
  </div>
  <div id="statuschip"><span id="dot"></span><span id="status">подключение...</span></div>
  <div id="list"><div class="empty">Ждём первый донат...</div></div>
  <div id="footer">
    <span class="stat"><b id="totalCount">0</b><span class="statlabel">донатов</span></span>
    <span class="stat"><b id="totalSum">0</b><span class="statlabel" id="curLabel">₽</span></span>
  </div>
</div>

<script>
/* ================= НАСТРОЙКИ ================= */
// Вставь сюда ссылку на виджет оповещений Donatty целиком
// (https://widgets.donatty.com/donations/?ref=...&token=...)
// либо передай ?ref=...&token=... в адресе этого виджета.
const WIDGET_URL = "https://widgets.donatty.com/top/?ref=50d26de8-a2c1-40d8-a899-4b43fd2575fb&token=1NuPzj21jTMTpe6Nff6Mk794PNV0N1";
const CURRENCY   = "₽";          // символ валюты в подписях
const PERIOD_MS  = 0;            // 0 — за всё время; 24*60*60*1000 — за сутки; 30*24*60*60*1000 — за месяц
const PONG_EVERY = 30 * 1000;    // как часто слать pong (мин. 5 сек, в Donatty по умолчанию 5 мин)
// Донаты, которые были до запуска виджета: [ник, сумма, (кол-во донатов)].
// Применяются при первом запуске и каждый раз, когда список изменён
// (текущие данные при этом заменяются списком).
const INITIAL_DONORS = [
  ["lsdss", 544],
  ["Пупс", 300],
  ["FilthyChild", 200],
  ["alenochka1998", 50],
  ["roothot", 50],
];
// Автосинхронизация топа с Donatty (подтягивает донаты, пришедшие пока виджет был выключен).
// Адрес запроса топа: {ref} и {token} подставятся сами. Пусто — синхронизация выключена.
// Не знаешь адрес — открой виджет с ?probe, он проверит вероятные адреса и напишет в консоль, какой сработал.
const SYNC_URL   = "";
const SYNC_EVERY = 60 * 1000;
const ZONE_OFFSET = -180;
const STORAGE_KEY = "donatty_top_donors";
/* ============================================= */

const API = "https://api.donatty.com";
const qs = new URLSearchParams(location.search);
let ref = qs.get("ref"), token = qs.get("token");
const CRED_KEY = "donatty_top_donors_creds";
function parseLink(text){
  try{
    const u = new URL(String(text).trim());
    const r = u.searchParams.get("ref"), t = u.searchParams.get("token");
    return (r && t) ? { ref:r, token:t } : null;
  }catch(e){ return null; }
}
if ((!ref || !token) && WIDGET_URL){ const c = parseLink(WIDGET_URL); if(c){ ref = ref || c.ref; token = token || c.token; } }
if (!ref || !token){
  try{ const c = JSON.parse(localStorage.getItem(CRED_KEY) || "null"); if(c){ ref = c.ref; token = c.token; } }catch(e){}
}
const DEBUG = qs.has("debug");

let donors = {}, totalCount = 0, totalSum = 0, periodStart = Date.now(), seen = [];
const $ = id => document.getElementById(id);
const dotEl = $('dot'), statusEl = $('status'), listEl = $('list');
$('curLabel').textContent = CURRENCY;

function setStatus(t, live){ statusEl.textContent = t; dotEl.classList.toggle('live', !!live); }
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmt(n){ return (Math.round(n*100)/100).toLocaleString('ru-RU'); }

/* ---------- хранение ---------- */
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({donors,totalCount,totalSum,periodStart,seen:seen.slice(-200)})); }catch(e){} }
function load(){
  try{
    const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(!p) return;
    if(PERIOD_MS && Date.now() - (p.periodStart||0) >= PERIOD_MS) return;
    donors = p.donors||{}; totalCount = p.totalCount||0; totalSum = p.totalSum||0; periodStart = p.periodStart||Date.now(); seen = p.seen||[];
  }catch(e){}
}
function reset(){ donors = {}; totalCount = 0; totalSum = 0; periodStart = Date.now(); seen = []; save(); render(); }
setInterval(() => { if(PERIOD_MS && Date.now() - periodStart >= PERIOD_MS) reset(); }, 30000);

/* ---------- разбор события ---------- */
// Реальный формат события Donatty (по открытой интеграции для Streamer.bot):
// {"action":"...","data":{"subscriber":"ник","amount":100,"currency":"RUB","message":"..."},"error":null}
// Пинги приходят как {"action":"PING"}.
function parseEvent(json){
  if(!json || json.error) return null;
  if(String(json.action || '').toUpperCase() === 'PING') return { ping:true };
  const d = json.data;
  if(!d || typeof d !== 'object') return null;
  const amount = parseFloat(d.amount);
  if(!(amount > 0)) return null;
  const name = String(d.subscriber || d.username || d.nickname || d.name || '').trim();
  return { name, amount, id: d.id || json.id || null };
}

function addDonation(d){
  if(!(d.amount > 0)) return;
  if(d.id){ if(seen.includes(d.id)) return; seen.push(d.id); }
  const name = d.name || 'Аноним';
  const key = name.toLowerCase();
  if(!donors[key]) donors[key] = { name, sum: 0, count: 0 };
  donors[key].name = name;
  donors[key].sum += d.amount;
  donors[key].count += 1;
  totalSum += d.amount; totalCount += 1;
  save(); render();
}

/* ---------- отрисовка ---------- */
const COLORS = ['#22c55e','#10b981','#14b8a6','#65a30d','#059669','#16a34a'];
function colorFor(s){ let h = 0; for(const c of s) h = c.charCodeAt(0) + ((h<<5)-h); return COLORS[Math.abs(h) % COLORS.length]; }
const BILL = `<svg viewBox="0 0 24 16" width="1.7em" height="1.13em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><rect x="1.5" y="1.5" width="21" height="13" rx="2.5" fill="rgba(109,255,178,.22)"/><circle cx="12" cy="8" r="3.2"/><path d="M5 5v.01M19 11v.01"/></svg>`;
const COINS = `<div class="coins">${[[24,0,12,3.6],[38,1.1,15,4.2],[52,2.3,11,3.4],[64,.6,14,4.0],[76,1.8,12,3.8],[88,2.9,10,3.5],[46,3.2,13,4.4]].map(([l,d,f,t]) => `<i style="left:${l}%;font-size:${f}px;animation-delay:${d}s;animation-duration:${t}s">${BILL}</i>`).join('')}</div>`;
const CROWN = `<svg width="24" height="16" viewBox="0 0 24 16" fill="none" stroke="#6dffb2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <rect x="1.5" y="1.5" width="21" height="13" rx="2.5" fill="rgba(109,255,178,.18)"/>
  <circle cx="12" cy="8" r="3.2"/>
  <path d="M5 5v.01M19 11v.01"/>
</svg>`;

function render(){
  const top = Object.values(donors).sort((a,b) => b.sum - a.sum).slice(0,3);
  $('totalCount').textContent = totalCount;
  $('totalSum').textContent = fmt(totalSum);
  if(!top.length){ listEl.innerHTML = '<div class="empty">Ждём первый донат...</div>'; return; }
  const max = top[0].sum || 1;
  listEl.innerHTML = top.map((e,i) => {
    const pct = Math.max(8, Math.round(e.sum / max * 100));
    const init = esc((e.name.trim().charAt(0) || '?').toUpperCase());
    return `<div class="row rank${i+1}">
      <div class="node">${i+1}</div>
      <div class="avatar-wrap">${i===0 ? `<div class="crown">${CROWN}</div>` : ''}<div class="avatar" style="background:${colorFor(e.name)}">${init}</div></div>
      <div class="textbox">
        <div class="info"><div class="name">${esc(e.name)}</div><div class="msglabel">донатов: ${e.count}</div></div>
        <div class="count">${fmt(e.sum)} ${CURRENCY}</div>
      </div>
      <div class="bar" style="width:${pct}%"></div>
      ${i===0 ? COINS : ''}
    </div>`;
  }).join('');
}

/* ---------- Donatty: токен → SSE ---------- */
let accessToken = null, abortCtl = null, pongTimer = null, retry = 1000, lastData = Date.now();
// Сторожок: если от Donatty 5 минут ничего (даже PING) — переподключаемся
setInterval(() => { if(abortCtl && Date.now() - lastData > 5*60*1000){ lastData = Date.now(); try{ abortCtl.abort(); }catch(e){} } }, 30000);

async function getAccessToken(){
  const r = await fetch(`${API}/auth/tokens/${encodeURIComponent(token)}`);
  if(!r.ok) throw new Error('token ' + r.status);
  const j = await r.json();
  return j.response.accessToken;
}

function pong(){
  if(!accessToken) return;
  fetch(`${API}/widgets/${encodeURIComponent(ref)}/pong`, { method:'POST', headers:{ Authorization:'Bearer ' + accessToken } })
    .then(r => { if(DEBUG) console.log('pong', r.status); }).catch(()=>{});
}

async function connect(){
  if(!ref || !token){ showSetup(); return; }
  setStatus('подключение...', false);
  clearInterval(pongTimer);
  try{
    accessToken = await getAccessToken();
    abortCtl = new AbortController();
    const url = `${API}/widgets/${encodeURIComponent(ref)}/sse?jwt=${encodeURIComponent(accessToken)}&zoneOffset=${ZONE_OFFSET}`;
    const res = await fetch(url, { headers:{ Accept:'text/event-stream' }, signal: abortCtl.signal });
    if(!res.ok || !res.body) throw new Error('sse ' + res.status);
    lastData = Date.now();
    setStatus('в эфире — донаты', true);
    retry = 1000;
    pong();
    pongTimer = setInterval(pong, PONG_EVERY);

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      lastData = Date.now();
      buf += dec.decode(value, { stream:true }).replace(/\r\n/g, '\n');
      let idx;
      while((idx = buf.indexOf('\n\n')) > -1){
        handleBlock(buf.slice(0, idx));
        buf = buf.slice(idx + 2);
      }
    }
    throw new Error('closed');
  }catch(err){
    if(DEBUG) console.warn(err);
    clearInterval(pongTimer);
    const why = /Failed to fetch|NetworkError|Load failed/i.test(err.message) ? 'нет сети или доступ закрыт (CORS)' : err.message;
    setStatus('переподключение… ' + String(why).slice(0, 44), false);
    setTimeout(connect, retry);
    retry = Math.min(retry * 1.6, 15000);
  }
}

function handleBlock(block){
  const data = [];
  for(const line of block.split('\n')){
    if(line.startsWith('data:')) data.push(line.slice(5).trim());
  }
  const raw = data.join('\n');
  if(DEBUG) console.log('SSE', raw);
  if(!raw) return;
  let json; try{ json = JSON.parse(raw); }catch(e){ return; }
  const ev = parseEvent(json);
  if(!ev) return;
  if(ev.ping){ pong(); return; }
  addDonation(ev);
}

/* ---------- автосинхронизация топа ---------- */
let syncUrl = SYNC_URL;
const NAME_K = ['subscriber','nickname','username','name','donor','from'];
const SUM_K  = ['amount','sum','total','value'];
// Ищет в ответе массив объектов «имя + сумма»
function extractList(j, depth = 0){
  if(!j || typeof j !== 'object' || depth > 4) return null;
  if(Array.isArray(j)){
    const out = [];
    for(const it of j){
      if(!it || typeof it !== 'object') continue;
      const nk = NAME_K.find(k => typeof it[k] === 'string');
      const sk = SUM_K.find(k => it[k] != null && typeof it[k] !== 'object' && !isNaN(parseFloat(it[k])));
      if(nk && sk) out.push({ name: it[nk].trim() || 'Аноним', sum: parseFloat(it[sk]), count: +(it.count || it.donations || 1) });
    }
    if(out.length) return out;
  }
  for(const k of Object.keys(j)){ const r = extractList(j[k], depth + 1); if(r) return r; }
  return null;
}
function applyServerTop(list){
  donors = {}; totalSum = 0;
  for(const it of list){
    const key = it.name.toLowerCase();
    donors[key] = donors[key] || { name: it.name, sum: 0, count: 0 };
    donors[key].sum += it.sum; donors[key].count += it.count || 1;
    totalSum += it.sum;
  }
  totalCount = Math.max(totalCount, Object.values(donors).reduce((a, d) => a + d.count, 0));
  save(); render();
}
async function fetchList(url){
  const headers = accessToken ? { Authorization: 'Bearer ' + accessToken } : {};
  const r = await fetch(url, { headers });
  if(DEBUG || qs.has('probe')) console.log('sync', r.status, url);
  if(!r.ok) return null;
  const txt = await r.text();
  if(DEBUG || qs.has('probe')) console.log(txt.slice(0, 400));
  try{ return extractList(JSON.parse(txt)); }catch(e){ return null; }
}
async function syncOnce(){
  if(!syncUrl || !ref || !token) return;
  try{
    const list = await fetchList(syncUrl.replace('{ref}', encodeURIComponent(ref)).replace('{token}', encodeURIComponent(token)));
    if(list && list.length) applyServerTop(list);
  }catch(e){ if(DEBUG) console.warn('sync', e); }
}
// Режим ?probe: перебор вероятных адресов (это предположения, не документация)
async function probe(){
  await new Promise(r => setTimeout(r, 2500)); // дождаться accessToken
  const R = encodeURIComponent(ref), T = encodeURIComponent(token);
  const cands = [
    `${API}/widgets/${R}/top`, `${API}/widgets/${R}/top?token=${T}`, `${API}/widgets/top/${T}`,
    `${API}/widgets/${R}/donators`, `${API}/widgets/${R}/leaderboard`, `${API}/widgets/${R}/stats/top`,
    `${API}/widgets/top?ref=${R}&token=${T}`, `${API}/widgets/stats/top/${T}`
  ];
  for(const u of cands){
    try{
      const list = await fetchList(u);
      if(list && list.length){
        console.log('%cНАЙДЕНО — впиши в SYNC_URL:', 'color:#0f0', u.replace(R, '{ref}').replace(T, '{token}'), list);
        syncUrl = u.replace(R, '{ref}').replace(T, '{token}');
        syncOnce(); return;
      }
    }catch(e){ console.log('probe error', u, e.message); }
  }
  console.log('Ни один из адресов не подошёл — пришли Script.js виджета «Топ».');
}
function startSync(){
  if(qs.has('probe')) probe();
  setTimeout(syncOnce, 3000);
  setInterval(syncOnce, SYNC_EVERY);
}

/* ---------- первая настройка: вставить ссылку на виджет ---------- */
function showSetup(){
  setStatus('нужна ссылка на виджет Donatty', false);
  listEl.innerHTML = `<div id="setup">
    <label>Вставь ссылку на виджет оповещений Donatty<br>(widgets.donatty.com/donations/?ref=…&token=…)</label>
    <input id="linkInput" type="text" placeholder="https://widgets.donatty.com/donations/?ref=...&token=..." autocomplete="off">
    <div class="err" id="linkErr"></div>
    <button id="linkBtn">Подключить</button>
  </div>`;
  const submit = () => {
    const c = parseLink($('linkInput').value);
    if(!c){ $('linkErr').textContent = 'В ссылке не нашёл ref и token'; return; }
    try{ localStorage.setItem(CRED_KEY, JSON.stringify(c)); }catch(e){}
    ref = c.ref; token = c.token;
    render(); connect();
  };
  $('linkBtn').onclick = submit;
  $('linkInput').addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
}

/* ---------- запуск ---------- */
load();
try{
  const SEED_KEY = STORAGE_KEY + "_seed", sig = JSON.stringify(INITIAL_DONORS);
  if(INITIAL_DONORS.length && localStorage.getItem(SEED_KEY) !== sig){
    donors = {}; totalSum = 0; totalCount = 0; periodStart = Date.now(); seen = [];
    for(const [n, sum, cnt] of INITIAL_DONORS){
      const name = String(n || 'Аноним'), key = name.toLowerCase(), c = cnt || 1;
      donors[key] = donors[key] || { name, sum: 0, count: 0 };
      donors[key].sum += +sum; donors[key].count += c;
      totalSum += +sum; totalCount += c;
    }
    localStorage.setItem(SEED_KEY, sig);
    save();
  }
}catch(e){}
render(); connect(); startSync();

// Горячие клавиши (OBS: ПКМ по источнику → Interact)
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'T' && e.shiftKey) addDonation({ name:['Алиса','Борис','Vlad','Саня'][Math.random()*4|0], amount:(Math.random()*500|0)+50 }); // тестовый донат
  if(e.key === 'L' && e.shiftKey){ try{ localStorage.removeItem(CRED_KEY); }catch(_){} if(abortCtl) abortCtl.abort(); ref = token = null; showSetup(); }
  if(e.key === 'R' && e.shiftKey) reset();                                                                                                  // сброс топа
});
